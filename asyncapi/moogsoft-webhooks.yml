note: 'Moogsoft publishes no AsyncAPI document. It does have a real, contract-backed bidirectional event
  surface: outbound webhooks that Moogsoft POSTs to a customer endpoint on alert and incident lifecycle
  changes, and inbound webhook endpoints that customers POST events to. Both are managed through OpenAPI
  operations rather than described as an event schema, so the PAYLOAD shape of an outbound webhook delivery
  is not published in a machine-readable form.'
