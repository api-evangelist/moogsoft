openapi: 3.2.0
info:
  version: 3.0.0
  title: Alerts/ Incidents API
  description: This API enables you to retrieve and update alerts and incidents, and other APIs relating to them
  termsOfService: https://www.moogsoft.com/legal-information/express-terms-conditions/
  contact:
    name: API Support
    url: https://docs.moogsoft.com/en/moogsoft-apis.html
    email: support@moogsoft.com
  license:
    url: https://www.moogsoft.com/legal-information
    name: Apex AIOps Incident Management Proprietary
servers:
- url: https://api.moogsoft.ai
- url: https://api.dev.moogsoft.cloud
security:
- ApiKeyAuth: []
tags:
- name: Incidents
  description: CRUD operations for incidents
paths:
  /v1/incidents/{incidentId}:
    put:
      tags:
      - Incidents
      summary: Update incident information
      description: Update incident information.
      operationId: updateIncidentPut
      parameters:
      - name: incidentId
        in: path
        description: Id of the incident that is being updated
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Update payload for the incident
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPayloadDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseIncidentDto'
        '400':
          description: Bad Request
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:edit
        description: Required user permissions for this endpoint
    patch:
      tags:
      - Incidents
      summary: Update the incident to the given status and/or assignee
      description: Update the incident to the given status and/or assignee.
      operationId: updateIncident
      parameters:
      - name: incidentId
        in: path
        description: Id of the incident that is being updated
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: JSON Patch payload for the incident
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPayloadDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseIncidentDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:edit
        description: Required user permissions for this endpoint
    get:
      tags:
      - Incidents
      summary: Get incident by id
      description: Get incident by id.
      operationId: getIncident
      parameters:
      - name: incidentId
        in: path
        description: Id of the incident that is being retrieved
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseIncidentDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:view
        description: Required user permissions for this endpoint
  /v1/incidents:
    patch:
      tags:
      - Incidents
      summary: Update multiple incidents to the given status and/or assignee
      description: Update the incidents to the given status and/or assignee.
      operationId: updateIncidents
      requestBody:
        description: Bulk update payload for the incidents
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPatchPayloadDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseListOfIncidentDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:edit
        description: Required user permissions for this endpoint
    get:
      tags:
      - Incidents
      summary: List incidents that match the given filter
      description: List incidents that match the given filter. Note that all GET requests are limited to a maximum of 10,000 items per query.
      operationId: listIncidents
      parameters:
      - name: User-Agent
        in: header
        schema:
          type: string
      - name: filter
        in: query
        description: Query string to filter the incidents by. The string must be in AIOps query language. You may use any of the columns for filtering.
        schema:
          type: string
          examples:
          - class in (Middleware, Hardware)
        examples:
          default:
            value: class in (Middleware, Hardware)
      - name: jsonFilter
        in: query
        description: Return only incidents that match this AG-Grid-style JSON filter, such as {"status":{"values":["open","in progress","resolved"],"filterType":"set"}}
        deprecated: true
        schema:
          type: string
      - name: jsonSort
        in: query
        description: Sort the results according to this AG-Grid-style JSON sort info, such as [{"sort":"asc","colId":"severity"}]
        deprecated: true
        schema:
          type: string
      - name: keyword
        in: query
        description: Return only incidents that contain these keywords.
        deprecated: true
        schema:
          type: string
          examples:
          - support
        examples:
          default:
            value: support
      - name: limit
        in: query
        description: Number of incidents to fetch, after skipping the number specified in the 'start' parameter if any. Between 1 and 5000
        schema:
          type: integer
          format: int32
          exclusiveMinimum: 0
          maximum: 5000
          default: '100'
          examples:
          - 100
        examples:
          default:
            value: 100
      - name: start
        in: query
        description: 'Number of incidents to skip. That is, the first incident returned will be object # start + 1.'
        schema:
          type: integer
          format: int32
          minimum: 0
          default: '0'
          examples:
          - 0
        examples:
          default:
            value: 0
      - name: utcOffset
        in: query
        description: The difference in hours from Coordinated Universal Time (UTC) to user's local time.
        schema:
          type: string
          default: GMT
          examples:
          - GMT-7/GMT+7:30
        examples:
          default:
            value: GMT-7/GMT+7:30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseIncidentList'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:view
        description: Required user permissions for this endpoint
    post:
      tags:
      - Incidents
      summary: Get a list of all incidents with matching criteria
      description: Get a list of all incidents with matching criteria. Note that all POST requests are limited to a maximum of 10,000 items per query.
      operationId: listIncidentsPost
      requestBody:
        description: List incidents request specification
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListIncidentsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseIncidentList'
        '400':
          description: Bad Request
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:view
        description: Required user permissions for this endpoint
  /v1/incidents/{incidentId}/external-ids:
    get:
      tags:
      - Incidents
      summary: Get all externalIds associated with the incident
      description: Get all externalIds associated with the incident. Returns the systemName and all the details
      operationId: getAllIncidentExternalIds
      parameters:
      - name: incidentId
        in: path
        description: incident ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseListOfExternalSystemDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:view
        description: Required user permissions for this endpoint
  /v1/incidents/{incidentId}/external-ids/{integrationId}:
    get:
      tags:
      - Incidents
      summary: Get details associated with specific external system
      description: Get details associated with a specific external system in the incident. Returns the systemName and all the details
      operationId: getIncidentExternalId
      parameters:
      - name: incidentId
        in: path
        description: incident ID
        required: true
        schema:
          type: integer
          format: int64
      - name: integrationId
        in: path
        description: integration ID
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseExternalSystemDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:view
        description: Required user permissions for this endpoint
    patch:
      tags:
      - Incidents
      summary: Update externalID information to an incident
      description: Updates details about an external system to the incident
      operationId: patchIncidentExternalId
      parameters:
      - name: incidentId
        in: path
        description: incident ID
        required: true
        schema:
          type: integer
          format: int64
      - name: integrationId
        in: path
        description: integration ID
        required: true
        schema:
          type: string
          pattern: \S
      requestBody:
        description: Configs used to update existing configs.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSystemDto'
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:edit
        description: Required user permissions for this endpoint
    delete:
      tags:
      - Incidents
      summary: Delete externalID information from an incident
      description: Delete details about an external system in the incident
      operationId: deleteIncidentExternalId
      parameters:
      - name: incidentId
        in: path
        description: incident ID
        required: true
        schema:
          type: integer
          format: int64
      - name: integrationId
        in: path
        description: integration ID
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:edit
        description: Required user permissions for this endpoint
    post:
      tags:
      - Incidents
      summary: Add externalID information to an incident
      description: Add details about an external system to the incident
      operationId: postIncidentExternalId
      parameters:
      - name: incidentId
        in: path
        description: incident ID
        required: true
        schema:
          type: integer
          format: int64
      - name: integrationId
        in: path
        description: integration ID
        required: true
        schema:
          type: string
          pattern: \S
      requestBody:
        description: Configs used to update existing configs.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSystemDto'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:edit
        description: Required user permissions for this endpoint
  /v1/incidents/{incidentId}/tags:
    patch:
      tags:
      - Incidents
      summary: Update the incident with the given tags
      description: Update the incident
      operationId: updateIncidentTags
      parameters:
      - name: incidentId
        in: path
        description: Id of the incident being updated
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Tags to attach to the incident
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIncidentTagsPayloadDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseIncidentDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - incidents:edit
        description: Required user permissions for this endpoint
  /v1/situation-room/{incidentId}/timeline:
    get:
      tags:
      - Incidents
      summary: Get timeline for an incident
      operationId: getIncidentTimeline
      parameters:
      - name: incidentId
        in: path
        description: Incident Id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseListOfIncidentTimelineDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
