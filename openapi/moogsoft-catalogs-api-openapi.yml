      summary: Deletes all the matching documents in the catalog
      description: 'Deletes all documents (rows) from a data catalog which include the specified value.

        Use the following example to model your API request. Include your API key,

        and replace `groupsCatalog` with the name of your catalog. Replace `name` with the name of the column containing

        the value, and replace `53` with your value.

        For example:


        curl --location --request DELETE ''https://api.dev.moogsoft.cloud/v1/catalogs/groupsCatalog/documents'' \

        --header ''apiKey: API_KEY_HERE'' \

        --header ''Content-Type: application/json'' \

        --data ''{

        "name": "53",

        "uuid": "53basd12313"

        }''

        You can also delete documents by specifying the document id.

        You can delete a single document by specifying a single id value, or delete multiple documents by providing an array of up to 10,000 IDs.

        For example:


        curl --location --request DELETE ''https://api.dev.moogsoft.cloud/v1/catalogs/groupsCatalog/documents'' \

        --header ''apiKey: API_KEY_HERE'' \

        --header ''Content-Type: application/json'' \

        --data ''{

        "_id": ["68c148122e2fa960380928d6", "68c148122e2fa960380928d5"]

