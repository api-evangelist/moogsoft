  /v1/catalog-files/{name}:
    patch:
      tags:
      - Catalogs
      summary: Replaces a catalog with schema and documents based on the given CSV file
      description: 'Replaces a catalog with schema and documents based on the given CSV file. For an example of the expected format, search for "enrichment CSV" in the API documentation.

        Note — You need to add the catalog file to the form data in the PATCH command. Suppose you want to upload the file using cURL.

        To do this, append a line to the auto-generated command that specifies the path and filename of the CSV you want to upload.

        For example:


        curl --request PATCH \

        --url https://api.moogsoft.ai/v1/catalog-files/data-center \

        --header ''Accept: application/json'' \

        --header ''Content-Type: multipart/form-data; boundary=---011000010111000001101001'' \

        --header ''apiKey: my-api-key'' \

        --form name=data-center-enrichment \

        --form description="Enrichment catalog for Data Center nodes" \

        # append this line....

        --form file=@/users/jane.smith/acme-catalogs/data-center.csv'
      operationId: replaceCatalog
      parameters:
      - name: synchronous
        in: query
