      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        description: Required user permissions for this endpoint
        value:
        - catalog:view
  /v3/catalogs/{catalogName}/search:
    post:
      tags:
      - Catalogs
      summary: Returns the matching documents in the catalog
      description: Returns the matching documents in the catalog. This is a POST rather than a GET due to the JSON body.
      operationId: searchCatalogDocumentsV3
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: '50'
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
      - name: catalogName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: List of AND'ed SearchFieldDto to be searched. Values are treated as an exact match and if the queried value is a string, then it is case-insensitive.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchFieldsDto'
      responses:
        '400':
          description: Bad Request
        '404':
          description: Requested object(s) not found
