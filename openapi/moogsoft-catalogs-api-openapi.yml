components:
  schemas:
    MoogResponseCatalogSettings:
      type: object
      description: Config API CatalogSettings response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
          - success
        data:
          $ref: '#/components/schemas/CatalogSettings'
      required:
      - status
      - data
    ComparisonOperator:
      type: string
      enum:
      - equals
      - contains
      title: Comparison Operator
      description: Comparison operator type to use for the filter
    MoogResponseDocumentDto:
      type: object
      description: Config API DocumentDto response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
          - success
        data:
          $ref: '#/components/schemas/DocumentDto'
      required:
      - status
      - data
    CatalogFieldSchemaType:
      type: string
      enum:
      - STRING
      - NUMBER
      - BOOLEAN
      - JSON_OBJECT
      - JSON_ARRAY
      title: Catalog Field Schema Type
    CatalogFieldSchema:
      type: object
      title: Catalog Field Schema
      properties:
        name:
          type: string
          pattern: ^[a-zA-Z\d-_]+$
          minLength: 1
        required:
          type: boolean
        type:
          $ref: '#/components/schemas/CatalogFieldSchemaType'
      required:
      - name
      - required
      - type
    SearchMatchType:
      type: string
      enum:
      - STRING
      - REGEX
      - RANGE
      title: Search Match Type
    SearchFieldsDto:
      type: array
      title: Search Fields Dto
      items:
        $ref: '#/components/schemas/SearchFieldDto'
    MoogResponseListOfCatalog:
      type: object
      description: Config API Catalog response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
          - success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Catalog'
      required:
      - status
      - data
    MoogResponseListOfDocumentDto:
      type: object
      description: Config API DocumentDto response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
          - success
        data:
          type: array
          items:
            $ref: '#/components/schemas/DocumentDto'
      required:
      - status
      - data
    MoogResponseCatalog:
      type: object
      description: Config API Catalog response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
          - success
        data:
          $ref: '#/components/schemas/Catalog'
      required:
      - status
      - data
    CatalogSchema:
      type: object
      title: Catalog Schema
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFieldSchema'
      required:
      - fields
    MoogFailureResponse:
      type: object
      description: Config API failure response body
      properties:
        status:
          type: string
          description: Failure status indicator (always "failure")
          examples:
          - failure
        message:
          type: string
        additional:
          type: array
          items:
            type: string
      required:
      - status
      - message
    CatalogSettings:
      type: object
      title: Catalog Settings
      properties:
        max_catalogs:
          type: integer
          description: Maximum number of allowed catalogs
          format: int64
          readOnly: true
        num_catalogs:
          type: integer
          description: Current number of catalogs
          format: int64
          readOnly: true
        maxCatalogs:
          type: integer
          description: Use max_catalogs instead
          format: int64
          readOnly: true
        numCatalogs:
          type: integer
          description: Use num_catalogs instead
          format: int64
          readOnly: true
    DocumentDto:
      type: object
      title: Document Dto
      additionalProperties:
        type: string
    Catalog:
      type: object
      title: Catalog
      properties:
        id:
          type: string
          description: Unique id of the catalog
          readOnly: true
        name:
          type: string
          description: Unique name of the catalog
          pattern: ^(?!system\.)[a-zA-Z0-9]([\w \-.]*)$
        description:
          type: string
          description: Description of the catalog
          pattern: \S
          minLength: 1
        schema:
          $ref: '#/components/schemas/CatalogSchema'
          description: Optional schema definition of the catalog
        created_by:
          type: string
          description: User id who created the catalog
          readOnly: true
        last_updated_by:
          type: string
          description: User id who last updated the catalog
          readOnly: true
        entries:
          type: integer
          description: Total number of entries in the catalog
          format: int64
          readOnly: true
        version:
          type: integer
          description: Version of the catalog with regard to full catalog replace operations.
          format: int64
          readOnly: true
        write_token:
          type: string
          description: Token to manage write access.
          readOnly: true
        last_updated:
          type: integer
          description: When the catalog was last updated
          format: int64
          readOnly: true
        created:
          type: integer
          description: When the catalog was created
          format: int64
          readOnly: true
        status:
          type: string
          description: Status of the catalog
          readOnly: true
        details:
          type: object
          description: Specific details regarding the catalog
          readOnly: true
        createdBy:
          type: string
          description: Use created_by instead
          readOnly: true
          x-deprecated: true
        lastUpdatedBy:
          type: string
          description: Use last_updated_by instead
          readOnly: true
          x-deprecated: true
        lastUpdated:
          type: integer
          description: Use last_updated instead
          format: int64
          readOnly: true
      required:
      - name
      - description
    MoogErrorResponse:
      type: object
      description: Config API error response body
      properties:
        status:
          type: string
          description: Error status indicator (always "error")
          examples:
          - error
        message:
          type: string
        additional:
          type: array
          items:
            type: string
      required:
      - status
      - message
    SearchFieldDto:
      type: object
      title: Search Field Dto
      properties:
        field_name:
          type: string
          minLength: 1
        match_type:
          $ref: '#/components/schemas/SearchMatchType'
          description: The type of match to use for the field.
        match_value: {}
        comparison_operator:
          $ref: '#/components/schemas/ComparisonOperator'
          description: The comparison operator to use for filtering. Note that this field only affects the search if the match_type is STRING. For other match types (RANGE, REGEX), this field is ignored.
      required:
      - field_name
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: API Key for accessing Config API
      name: apiKey
      in: header
externalDocs:
  url: https://docs.moogsoft.com/en/moogsoft-apis.html
  description: Find out more about Apex AIOps Incident Management
