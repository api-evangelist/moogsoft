  /v1/catalog-files:
    post:
      tags:
        - catalogs
      summary: Creates a new catalog with schema and documents based on the given CSV file.
      description: |-
        Creates a new catalog with schema and documents based on the given CSV file. For an example of the expected format, search for "enrichment CSV" in the Moogsoft documentation.
        Note — You need to add the catalog file to the form data in the POST command. Suppose you want to upload the file using cURL.
        To do this, append a line to the auto-generated command that specifies the path and filename of the CSV you want to upload.
        For example:

            curl --request POST \
              --url https://api.moogsoft.ai/v1/catalog-files \
              --header 'Accept: application/json' \
              --header 'Content-Type: multipart/form-data; boundary=---011000010111000001101001' \
              --header 'apiKey: my-api-key' \
              # append this line....
              --form file=@/users/jane.smith/moogsoft-catalogs/data-center.csv
      operationId: uploadNewCatalog
      parameters:
        - name: synchronous
          in: query
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: '^(?!system\.)[a-zA-Z0-9]([\w \-.]*)$'
                  minLength: 1
                  maxLength: 127
                description:
                  type: string
                  pattern: \S
                  minLength: 1
                file:
                  type: string
                  contentMediaType: application/octet-stream
              required:
                - name
                - description
                - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseCatalog'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
        - ApiKeyAuth: []
      servers:
        - url: 'https://api.moogsoft.ai'
        - url: 'https://api.dev.moogsoft.cloud'
      x-permissions:
        description: Required user permissions for this endpoint
