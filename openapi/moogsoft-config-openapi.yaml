    CorrelationDefinitionDto:
      type: object
      title: CorrelationDefinition
      properties:
        name:
          type: string
          description: 'The name of the correlation definition. During an update, this field can be omitted to retain the existing value.'
          pattern: '^[a-zA-Z0-9()_\-\s/]+$'
          maxLength: 127
          examples:
            - Similar Sources
        description:
          type: string
          description: The description for the correlation definition.
          examples:
            - Correlates incidents according to the similarity of their sources.
        type:
          $ref: '#/components/schemas/DefinitionType'
        uuid:
          type: string
          description: Populated with the internal ID of the retrieved definition. Not used when creating or updating a definition.
          readOnly: true
        fields_to_correlate:
          type: object
          description: 'The set of alert fields to consider for correlation, and the similarity required for a match between an alert and an incident. Object keys are the field name and values are the similarity as a value from 0.0 to 1.0. During an update, this field can be omitted to retain the existing value.'
          additionalProperties:
            type: number
            format: double
          examples:
            - source: 0.45
        correlation_time_period:
          type: integer
          description: 'The window (in seconds) for correlating alerts into the same incident. During an update, this field can be omitted to retain the existing value.'
          format: int32
          minimum: 0
          default: 3900
          examples:
            - 3600
        incident_description:
          type: string
          description: 'The description to use for all incidents that get generated from this correlation definition. You can use macros to generate incident descriptions dynamically based on the member alerts. During an update, this field can be omitted to retain the existing value.'
          examples:
            - 'unique_count(source) Source: unique(source,3) Affected unique(service,3) unique(class,3)'
        group_id:
          type:
            - string
            - 'null'
          description: 'Read-only reference to the correlation group, if any, that contains this definition.'
          readOnly: true
        catchAll:
          type: boolean
          writeOnly: true
        created_by:
          type: string
          description: User ID or email of the creator
          readOnly: true
          examples:
            - user@example.com
        last_updated_by:
          type: string
          description: User ID or email of the last updater
          readOnly: true
          examples:
            - user@example.com
        created:
          type:
            - number
            - 'null'
          description: Read-only reference to the created time. Time is a UTC timestamp.
          readOnly: true
          anyOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        last_updated:
          type:
            - number
            - 'null'
          description: Read-only reference to the last updated time. Time is a UTC timestamp.
          readOnly: true
          anyOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
      required:
        - type
      default: scoped
      discriminator:
        propertyName: type
        mapping:
          scoped: '#/components/schemas/ScopedCorrelationDefinitionDto'
          seeded: '#/components/schemas/SeededCorrelationDefinitionDto'
