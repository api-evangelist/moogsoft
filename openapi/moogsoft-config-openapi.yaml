          maxLength: 127
          examples:
            - Default Group
        uuid:
          type: string
          description: Populated with the generated ID of the definition group. Not used when creating or updating a definition.
          readOnly: true
        disabled:
          type: boolean
          description: Allows for disabling correlation processing by this group and definitions referenced by it.
          default: false
        catch_all:
          type: boolean
          description: 'If set to true, an alert will always land in a catch all definition, if no other definitions match'
        definitions:
          type: array
          description: Ordered reference to the correlation definitions in this group
          items:
            $ref: '#/components/schemas/DefinitionReferenceDto'
        incident_merge_threshold:
          $ref: '#/components/schemas/IncidentMergeThreshold'
          description: 'Specifies how many alerts the active and candidate incidents should have in common in order to be merged and/or superseded. During an update, this field can be omitted to retain the existing value.'
        short_circuit_evaluation:
          type: boolean
          description: 'If set to true, first matched definition stops any further definition evaluations'
        scope:
          type:
            - string
            - 'null'
          description: 'Optional alert filter to limit the scope of alerts to consider for this group. An empty can be set to disable the scope filter. During an update, this field can be omitted to retain the existing value.'
        created_by:
          type: string
          description: User ID or email of the creator
          readOnly: true
          examples:
            - user@example.com
        last_updated_by:
          type: string
          description: User ID or email of the last updater
          readOnly: true
          examples:
            - user@example.com
        created:
