          type: string
          description: email of the user who is assigned to the alert/incident
          examples:
          - test@moogsoft.com
        assigned_groups:
          type: array
          description: An array of group ids
          examples:
          - - goupid1
            - groupid2
          items:
            type: string
        first_event_time:
          type: integer
          description: Epoch timestamp in seconds of the first event for this alert/incident
          format: int64
          examples:
          - 1607985505
        last_event_time:
          type: integer
          description: Epoch timestamp in seconds of the last event for this alert/incident
          format: int64
          examples:
          - 1607985505
        description:
          type: string
          description: description that usually contains the alert/incident ID, source and service
          examples:
          - '1 Source: www.your-source.com Affected retail, support

            '
        status_numeric:
          type: integer
          format: int32
        severity_numeric:
          type: integer
          format: int32
        severity_high_water_numeric:
          type: integer
          format: int32
        alert_id:
          type: integer
          format: int64
        class:
          type: string
        event_count:
          type: integer
          format: int32
        manager_id:
          type: string
        location:
          type: object
          description: Mapping of location name/value pairs
          examples:
          - street: 1234 Battery St.
            city: San Francisco
            state: CA
            postcode: '95454'
        service:
          type: array
          items:
            type: string
        incidents:
          type: array
          items:
            type: integer
            format: int64
        source:
          type: string
        in_maintenance:
          type: boolean
          description: Boolean indicating if the alert is currently in maintenance
        maintenance:
          type: string
          description: The id of the current or most recent maintenance window occurrence the alert was in
        maintenance_windows:
          type: array
          description: Set of all maintenance windows and occurrences the alert has been associated with
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MaintenanceWindowStatDto'
        tags:
          type: object
          description: Mapping of tag name/value pairs
          examples:
          - key1: value1
            key2: value2
        namespace:
          type: string
        manager:
          type: string
        dedupe_key:
          type: string
        created_at:
          type: integer
          description: Epoch timestamp in seconds indicating when the alert was created
          format: int64
          examples:
          - 1607985505
        last_status_change_time:
          type: integer
          format: int64
        alias:
          type: string
        check:
          type: string
        type:
          type: string
        policy:
          type: string
        external_details:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSystemDto'
        external_names:
          type: array
          items:
            type: string
