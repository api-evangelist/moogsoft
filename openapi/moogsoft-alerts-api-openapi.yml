components:
  schemas:
    SituationJsonFilterDto:
      type: object
      title: Situation Json Filter Dto
      properties:
        type:
          const: JSON
          description: Declares json filter type
        filter_object:
          $ref: '#/components/schemas/ColumnFilterMap'
          description: Return only alerts that match this AG-Grid-style JSON filter (See ColumnFilter schema).
        sort_criteria:
          type: array
          description: Sort the results according to this AG-Grid-style JSON sort array.
          examples:
          - - sort: asc
              colId: severity
            - sort: desc
              colId: alert_id
          items:
            $ref: '#/components/schemas/AgGridSortColumn'
      required:
      - type
    ListSnapshotRequest:
      type: object
      title: List Snapshot Request
      description: List alert snapshot POST request body.
      properties:
        ids:
          type: array
          description: Unique alert IDs for which to retrieve earliest/highest severity snapshot
          minItems: 1
          examples:
          - - 12
            - 29
          items:
            type: integer
            format: int64
        fields:
          type: array
          description: Subset of fields to return (default is all non-null alert fields)
          items:
            type: string
      required:
      - ids
    SortOrder:
      type: string
      enum:
      - asc
      - desc
      title: Sort Order
      default: desc
    DateColumnFilter:
      type: object
      title: Date Column Filter
      description: Filter a date-based column based on date or date ranges, and a comparison type<br>filterType = "date"
      properties:
        type:
          $ref: '#/components/schemas/ComparisonType'
          description: Comparison operator
        dateFrom:
          type: string
          description: Date filter value to used with comparison operator
        dateTo:
          type: string
          description: Date filter value to used when comparison operator is inRange
        filterType:
          const: date
          description: Declares date filterType
      required:
      - type
      - filterType
    UnlabeledResponseDto:
      type: object
      title: Unlabeled Response Dto
      properties:
        total_incidents:
          type: integer
          format: int64
        total_alerts:
          type: integer
          format: int64
        unlabeled_counts:
          type: object
          additionalProperties:
            type: integer
            format: int64
    BulkAlertUpdateRequest:
      type: object
      title: Bulk Alert Update Request
      properties:
        status:
          $ref: '#/components/schemas/Status'
        assignee:
          type: string
          description: Username of the assignee, specified as one string. Returns an error if the username is not found.
          examples:
          - john.doe@company.com
        assigned_groups:
          type: array
          description: An array of group ids or group names, returns error if any of them not found
          examples:
          - - groupid1
            - groupid2
          uniqueItems: true
          items:
            type: string
        ids:
          type: array
          description: Unique alert ids to update
          minItems: 1
          examples:
          - - 12
            - 29
          uniqueItems: true
          items:
            type: integer
            format: int64
      required:
      - ids
    MoogFailureResponse:
      type: object
      description: Alerts/Incidents API failure response body
      properties:
        status:
          type: string
          description: Failure status indicator (always "failure")
          examples:
          - failure
        message:
          type: string
        additional:
          type: array
          items:
            type: string
      required:
      - status
      - message
    Severity:
      type: string
      enum:
      - clear
      - unknown
      - warning
      - minor
      - major
      - critical
      title: Severity
      description: Severity Level (case-insensitive)
    AlertPrc:
      type: object
      title: SituationRoomAlertDetails
      properties:
        rc_probability:
          type: number
          description: The computed root cause probability, 0.0 - 1.0, if any
        rc_label:
          $ref: '#/components/schemas/PrcLabel'
          description: The user-assigned label, if any
        rc_bucket:
          $ref: '#/components/schemas/PrcBucket'
          description: 'The computed level: high, medium, low'
    MoogResponseEventList:
      type: object
      description: Alerts/Incidents API EventList response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
          - success
        data:
          $ref: '#/components/schemas/EventList'
      required:
      - status
      - data
    SetColumnFilter:
      type: object
      title: Set Column Filter
      description: Filter a column based on a set of values provided for comparison<br>filterType = "set"
      properties:
        type:
          $ref: '#/components/schemas/ComparisonType'
          description: Comparison operator
        values:
          type: array
          description: Set filter value(s) to used with comparison operator
          items:
            type: string
        filterType:
          const: set
          description: Declares set filterType
      required:
      - type
      - values
      - filterType
    MoogResponseUnlabeledResponseDto:
      type: object
      description: Alerts/Incidents API UnlabeledResponseDto response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
          - success
        data:
          $ref: '#/components/schemas/UnlabeledResponseDto'
      required:
      - status
      - data
    QueryFilter:
      type: object
      title: Query Filter
      description: Types of inputs for the queryFilter.
      oneOf:
      - $ref: '#/components/schemas/SituationTextFilterDto'
      - $ref: '#/components/schemas/SituationJsonFilterDto'
    EventTimelineDto:
      type: object
      title: Event Timeline Dto
      properties:
        event_id:
          type: string
        source:
          type: string
        check:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        description:
          type: string
        dedupe_key:
          type: string
        time:
          type: integer
          format: int64
        services:
          type: array
          items:
            type: string
        alias:
          type: string
        utc_offset:
          type: string
        manager:
          type: string
        manager_id:
          type: string
        class:
          type: string
        namespace:
          type: string
        maintenance:
          type: string
        type:
          type: string
        tags:
          type: object
        location:
          $ref: '#/components/schemas/LocationDto'
        policy:
          type: string
        additional_info:
          type: object
        sequence_id:
          type: integer
          format: int32
      required:
      - source
      - check
      - severity
      - description
    ComparisonType:
      type: string
      enum:
      - equals
      - notEqual
      - contains
      - notContains
      - startsWith
      - endsWith
      - lessThan
      - lessThanOrEqual
      - greaterThan
      - greaterThanOrEqual
      - inRange
      - blank
      - notBlank
      - exactMatch
      - notExactMatch
      title: Comparison Type
      description: Comparison operator type to use for the filter
    ExternalSystemDto:
      type: object
      title: External System Dto
      properties:
        integration_id:
          type: string
        external_name:
          type: string
        external_id:
          type: string
        external_link:
          type: string
        integration_name:
          type: string
        integration_type:
          type: string
    MaintenanceWindowStatDto:
      type: object
      title: Maintenance Window Stat Dto
      properties:
        window_id:
          type: string
          description: unique id of the maintenance window
        occurrence_id:
          type: string
          description: unique id of the maintenance window occurrence
        enter:
          type: integer
          description: Epoch timestamp in millis of when the alert entered maintenance
          format: int64
        exit:
          type: integer
          description: Epoch timestamp in millis of when the alert left maintenance
          format: int64
    ListAlertsRequest:
      type: object
      title: List Alerts Request
      description: List alerts POST request body.
      properties:
        filter:
          type: string
          description: Return only alerts that match this filter.<br>Returns **400 (Invalid parameters)** if the filter format is invalid.
          examples:
          - '''event count'' > 3 AND severity in (Critical, Major, Minor, Warning)'
        json_filter:
          type: object
          description: Return only alerts that match this AG-Grid-style JSON filter. Each filter can be of a different filterType.
          additionalProperties:
            $ref: '#/components/schemas/ColumnFilter'
          examples:
          - status:
              values:
              - open
              - in progress
              - resolved
              filterType: set
        json_sort:
          type: array
          description: Sort the results according to this AG-Grid-style JSON sort array.
          examples:
          - - sort: asc
              colId: severity
            - sort: desc
              colId: alert_id
          items:
            $ref: '#/components/schemas/AgGridSortColumn'
        keyword:
          type: string
          description: Return only alerts that contain these keywords.
        utc_offset:
          type: string
          description: UTC Offset
          default: GMT-0
        start:
          type: integer
          description: The starting offset of alerts to retrieve. The initial offset to use is 0 and thereafter is typically multiples of 'limit'. <b>NOTE:</b> 'start' + 'limit' must not exceed 10,000 -- use 'searchAfter' instead.
          format: int32
          minimum: 0
          default: 0
        limit:
          type: integer
          description: Maximum number of alerts to return. This is equivalent to the maximum number of alerts per page. Between 1 and 5000
          format: int32
          exclusiveMinimum: 0
          maximum: 5000
          default: 100
        sort_by:
          type: string
          description: Field to sort by
        sort_order:
          $ref: '#/components/schemas/SortOrder'
          description: Sort order
        search_after:
          type: array
          description: When needing to scroll through a large number of alerts, this parameter can be used instead of 'start' to proceed with alerts that follow the previous search result. The 'searchAfter' from the previous response must be provided along with the same filter and sort criteria. All results are exhausted when a search response includes no more alerts.
        fields:
          type: array
          description: Subset of fields to return (default is all non-null alert fields
          items:
            type: string
    Status:
      type: string
      enum:
      - error
      - open
      - in progress
      - superseded
      - resolved
      - closed
