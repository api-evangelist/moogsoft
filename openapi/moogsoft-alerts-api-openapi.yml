          boolean: '#/components/schemas/BooleanColumnFilter'
    MoogResponseListOfAlertDto:
      type: object
      description: Alerts/Incidents API AlertDto response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
