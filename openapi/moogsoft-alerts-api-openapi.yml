        severity_numeric:
          type: integer
          format: int32
        severity_high_water_numeric:
          type: integer
          format: int32
        alert_id:
          type: integer
          format: int64
        class:
          type: string
        event_count:
          type: integer
          format: int32
        manager_id:
          type: string
        location:
          type: object
          description: Mapping of location name/value pairs
          examples:
