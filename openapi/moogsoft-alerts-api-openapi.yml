openapi: 3.2.0
info:
  version: 3.0.0
  title: /Incidents Alerts API
  description: This API enables you to retrieve and update alerts and incidents, and other APIs relating to them
  termsOfService: https://www.moogsoft.com/legal-information/express-terms-conditions/
  contact:
    name: API Support
    url: https://docs.moogsoft.com/en/moogsoft-apis.html
    email: support@moogsoft.com
  license:
    url: https://www.moogsoft.com/legal-information
    name: Apex AIOps Incident Management Proprietary
servers:
- url: https://api.moogsoft.ai
- url: https://api.dev.moogsoft.cloud
security:
- ApiKeyAuth: []
tags:
- name: Alerts
  description: Alerts generated by Moogsoft Cloud
paths:
  /v2/situation-room/{incidentId}/alerts:
    post:
      tags:
      - Alerts
      summary: Get alerts for an incident, for the situation room
      operationId: getSituationRoomAlertsV2
      parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SituationRoomAlertsRequestV2'
              __errors__:
                '#/components/schemas/ColumnFilterMap': No foreign doc with id components found
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseSituationRoomAlertList'
        '400':
          description: Bad Request
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:view
        description: Required user permissions for this endpoint
  /v1/alerts/{alertId}/external-ids/{integrationId}:
    get:
      tags:
      - Alerts
      summary: Get details associated with specific external system
      description: Get details associated with a specific external system in the alert. Returns the systemName and all the details
      operationId: getAlertExternalId
      parameters:
      - name: alertId
        in: path
        description: alert ID
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: integrationId
        in: path
        description: integration ID
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseExternalSystemDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:view
        description: Required user permissions for this endpoint
    patch:
      tags:
      - Alerts
      summary: Add externalID information to an alert
      description: Add details about an external system to the alert
      operationId: patchAlertExternalId
      parameters:
      - name: alertId
        in: path
        description: alert ID
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: integrationId
        in: path
        description: integration ID
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        description: Configs used to update existing configs.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSystemDto'
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:edit
        description: Required user permissions for this endpoint
    delete:
      tags:
      - Alerts
      summary: Delete externalID information to an alert
      description: Delete details about an external system in the alert
      operationId: deleteAlertExternalId
      parameters:
      - name: alertId
        in: path
        description: alert ID
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: integrationId
        in: path
        description: integration ID
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:edit
        description: Required user permissions for this endpoint
    post:
      tags:
      - Alerts
      summary: Add externalID information to an alert
      description: Add details about an external system to the alert
      operationId: postAlertExternalId
      parameters:
      - name: alertId
        in: path
        description: alert ID
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: integrationId
        in: path
        description: integration ID
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        description: Configs used to update existing configs.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSystemDto'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:edit
        description: Required user permissions for this endpoint
  /v1/alerts/{alert_id}/events-timeline:
    get:
      tags:
      - Alerts
      summary: List the event timeline buckets associated with the specified alert
      description: Get the event timeline buckets that represent the count of event severities, for specified interval and start time
      operationId: getEventTimelineByAlertId
      parameters:
      - name: bucket_interval
        in: query
        description: Time interval of each bucket (in seconds).
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
          examples:
          - 3600
        examples:
          default:
            value: 3600
      - name: bucket_start_time
        in: query
        description: Start time of the first bucket. If it is not provided, the default will be considered as the first_event_time.
        schema:
          type: integer
          format: int64
          examples:
          - 1720083965000
        examples:
          default:
            value: 1720083965000
      - name: alert_id
        in: path
        description: ID of the alert to use, returns 404 if there is no alert for the alertId.
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
          examples:
          - 1
        examples:
          default:
            value: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseListOfEventTimelineBucket'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:view
        description: Required user permissions for this endpoint
  /v1/alerts/{alertId}/snapshot:
    get:
      tags:
      - Alerts
      summary: Get an alert snapshots, with highest severity
      description: The alert returned is a snapshot of the earliest and highest severity.
      operationId: getAlertSnapshot
      parameters:
      - name: alertId
        in: path
        description: ID of the alert to use. Returns 404 if there is no alert for the alertId.
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseAlertDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:view
        description: Required user permissions for this endpoint
  /v1/alerts/{alertId}:
    patch:
      tags:
      - Alerts
      summary: Update the "status" or "assignee" or "assigned_groups" field in a specific alert
      description: Updates a single alert.
      operationId: updateAlert
      parameters:
      - name: alertId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseAlertDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:edit
        description: Required user permissions for this endpoint
    get:
      tags:
      - Alerts
      summary: Get details of the alert with the specified ID
      description: Returns a single alert.
      operationId: alertDetails
      parameters:
      - name: User-Agent
        in: header
        schema:
          type: string
      - name: alertId
        in: path
        description: ID of the alert to return. Returns 400 (Invalid ID Supplied) if this value is anything other than a non-negative integer.
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseAlertDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:view
        description: Required user permissions for this endpoint
  /v1/alerts/{alertId}/tags:
    patch:
      tags:
      - Alerts
      summary: Overwrite the tags of an alert with the supplied tags
      description: Updates the tags of an alert.
      operationId: updateAlertTags
      parameters:
      - name: alertId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAlertTagsPayloadDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseAlertDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:edit
        description: Required user permissions for this endpoint
  /v1/alerts/{alert_id}/events:
    get:
      tags:
      - Alerts
      summary: List event by alertId with given timeline
      description: Get event details for given filter and pagination parameters
      operationId: listEventsByAlertId
      parameters:
      - name: end_time
        in: query
        description: End time to fetch events up to. If not provided then consider alert's last event time as default
        schema:
          type: integer
          format: int64
          examples:
          - 1720083965000
        examples:
          default:
            value: 1720083965000
      - name: limit
        in: query
        description: Maximum number of events to return per page.
        schema:
          type: integer
          format: int32
          exclusiveMinimum: 0
          maximum: 1000
          default: 1000
          examples:
          - 1000
        examples:
          default:
            value: 1000
      - name: offset
        in: query
        description: Number of events to skip
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
          examples:
          - 0
        examples:
          default:
            value: 0
      - name: start_time
        in: query
        description: Start time to fetch events from.
        schema:
          type: integer
          format: int64
          examples:
          - 1720083965000
        examples:
          default:
            value: 1720083965000
      - name: alert_id
        in: path
        description: ID of the alert to use. Returns 404 if there is no alert for the alertId.
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
          examples:
          - 1
        examples:
          default:
            value: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseEventList'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:view
        description: Required user permissions for this endpoint
  /v1/alerts/{alertId}/external-ids:
    get:
      tags:
      - Alerts
      summary: Get all externalIds associated with the alert
      description: Get all externalIds associated with the alert. Returns the systemName and all the details
      operationId: getAllAlertExternalIds
      parameters:
      - name: alertId
        in: path
        description: alert ID
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseListOfExternalSystemDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:view
        description: Required user permissions for this endpoint
  /v1/alerts/snapshot:
    post:
      tags:
      - Alerts
      summary: Get a list of alert snapshots, with highest severity
      description: Each alert returned is a snapshot of the earliest and highest severity.
      operationId: listAlertSnapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSnapshotRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseAlertList'
        '400':
          description: Bad Request
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:view
        description: Required user permissions for this endpoint
  /v1/situation-room/{incidentId}/alerts/unlabeled:
    get:
      tags:
      - Alerts
      summary: Get alerts for an incident, that are unlabeled
      description: Get alerts for an incident as recommended alerts to take action on
      operationId: getUnlabeledAlerts
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          exclusiveMinimum: 0
          default: 100
      - name: rc_bucket
        in: query
        schema:
          $ref: '#/components/schemas/PrcBucket'
      - name: sort_by
        in: query
        required: true
        schema:
          type: string
          enum:
          - rc_probability
          - rc_bucket
          description: Specifies the sort criteria to use
          pattern: ^(rc_probability|rc_bucket)$
          default: rc_probability
      - name: sort_order
        in: query
        required: true
        schema:
          type: object
          description: Sort order
          default: desc
      - name: incidentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseSituationRoomAlertList'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
      x-permissions:
        value:
        - alerts:view
        description: Required user permissions for this endpoint
  /v1/situation-room/alerts/unlabeled:
    post:
      tags:
      - Alerts
      summary: Get total count of unlabeled incidents/alerts, for a set of incidents
      description: Count number of incidents and alerts that are unlabeled, given a set of incident IDs
      operationId: getUnlabeledCount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlabeledRequestDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseUnlabeledResponseDto'
        '400':
          description: Bad Request
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
