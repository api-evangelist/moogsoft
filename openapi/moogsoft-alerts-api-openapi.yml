        namespace:
          type: string
        manager:
          type: string
        dedupe_key:
          type: string
        created_at:
          type: integer
          description: Epoch timestamp in seconds indicating when the alert was created
          format: int64
          examples:
          - 1607985505
        last_status_change_time:
          type: integer
          format: int64
        alias:
          type: string
        check:
          type: string
        type:
          type: string
        policy:
          type: string
        external_details:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSystemDto'
        external_names:
          type: array
          items:
            type: string
