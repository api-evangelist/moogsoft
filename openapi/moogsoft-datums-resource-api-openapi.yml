    Engine:
      type: object
      properties:
        median:
          type: number
          format: double
        highSigma:
          type: number
          format: double
        lowSigma:
          type: number
          format: double
        highThreshold:
          type: number
          format: double
        lowThreshold:
          type: number
          format: double
        confidence:
          type: number
          format: double
        severity:
          type: integer
          format: int64
        learning:
          type: boolean
        DETECTOR_CLASS:
          type: string
        holdfor:
          type: integer
          format: int32
        vector:
          type: integer
          format: int32
        sigma:
          type: number
          format: double
        stateful:
          type: boolean
    GetSlimDatumResultsDto:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SlimDatumDto'
        total:
          type: integer
          format: int64
