          $ref: '#/components/schemas/Timestamp'
          description: Start time of the maintenance window, milliseconds since Jan 1, 1970 GMT
        duration:
          type: integer
          description: Duration of the maintenance window, in seconds
          format: int32
          minimum: 60
        timezone:
          type: string
          description: Optional timezone of the maintenance window; used for display purposes
        repeats:
          $ref: '#/components/schemas/Repeatable'
          description: 'Optional repeating operation (note: only one of ''until'' and ''times'' is allowed to be used)'
          discriminator:
            propertyName: period
            mapping:
              daily: '#/components/schemas/DailyRepeatable'
              weekly: '#/components/schemas/WeeklyRepeatable'
              monthly: '#/components/schemas/MonthlyRepeatable'
              monthly_nth_day: '#/components/schemas/MonthlyDaysRepeatable'
      required:
      - filter
      - start
      - duration
    MoogErrorResponse:
      type: object
      description: Config API error response body
      properties:
        status:
          type: string
          description: Error status indicator (always "error")
          examples:
          - error
        message:
          type: string
        additional:
          type: array
          items:
            type: string
      required:
      - status
      - message
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: API Key for accessing Config API
      name: apiKey
      in: header
