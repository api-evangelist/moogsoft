        - maintenance:edit
  /v1/timezones:
    get:
      tags:
      - Maintenance Windows
      summary: Get all available timezones
      operationId: getAllTimezones
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogResponseListOfTimezoneDto'
        '400':
          description: Invalid parameters or data validation violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        '404':
          description: Requested object(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        4XX:
          description: Authorization or other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogFailureResponse'
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoogErrorResponse'
      security:
      - ApiKeyAuth: []
      servers:
      - url: https://api.moogsoft.ai
      - url: https://api.dev.moogsoft.cloud
components:
  schemas:
    MoogResponseMaintenanceWindowListDto:
      type: object
      description: Config API MaintenanceWindowListDto response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
          - success
        data:
          $ref: '#/components/schemas/MaintenanceWindowListDto'
      required:
      - status
      - data
    MoogResponseMaintenanceOccurrenceListDto:
      type: object
      description: Config API MaintenanceOccurrenceListDto response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
          - success
        data:
          $ref: '#/components/schemas/MaintenanceOccurrenceListDto'
      required:
      - status
      - data
    MoogResponseMaintenanceWindowDto:
      type: object
      description: Config API MaintenanceWindowDto response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
          - success
        data:
          $ref: '#/components/schemas/MaintenanceWindowDto'
      required:
      - status
      - data
    MaintenanceWindowDto:
      type: object
      title: Maintenance Window Dto
      description: Definition for a given scheduled maintenance window
      properties:
        name:
          type: string
          description: Name of the maintenance window
          pattern: ^[a-zA-Z0-9()_\-\s]+$
        description:
          type: string
          description: Description of the maintenance window
        external_link:
          type: string
          description: Optional change Record link to an external system
        filter:
          type: string
          description: Required filter string
        start:
          $ref: '#/components/schemas/Timestamp'
          description: Start time of the maintenance window, milliseconds since Jan 1, 1970 GMT
        duration:
          type: integer
          description: Duration of the maintenance window, in seconds
          format: int32
          minimum: 60
        timezone:
          type: string
          description: Optional timezone of the maintenance window; used for display purposes
        repeats:
          $ref: '#/components/schemas/Repeatable'
          description: 'Optional repeating operation (note: only one of ''until'' and ''times'' is allowed to be used)'
          discriminator:
            propertyName: period
            mapping:
              daily: '#/components/schemas/DailyRepeatable'
              weekly: '#/components/schemas/WeeklyRepeatable'
              monthly: '#/components/schemas/MonthlyRepeatable'
              monthly_nth_day: '#/components/schemas/MonthlyDaysRepeatable'
        status:
          $ref: '#/components/schemas/MaintenanceStatus'
          description: Status of the maintenance window, based upon occurrences
        created:
          $ref: '#/components/schemas/Timestamp'
          description: When the maintenance window was created
        last_updated:
          $ref: '#/components/schemas/Timestamp'
          description: When the maintenance window was last updated
        created_by:
          type: string
          description: User who created the maintenance window
          readOnly: true
        last_updated_by:
          type: string
          description: User who last updated the maintenance window
          readOnly: true
        id:
          type: string
          description: Unique id of the maintenance window
          readOnly: true
        deleted:
          type: boolean
          description: Indicates whether the maintenance window was DELETED
          readOnly: true
      required:
      - filter
      - start
      - duration
    SchedulePeriod:
      type: string
      enum:
      - daily
      - weekly
      - monthly
      - monthly_nth_day
      title: Schedule Period
      description: Scheduling Periodicity
    MaintenanceWindowListDto:
      type: object
      title: Maintenance Window List Dto
      properties:
        result:
          type: array
          description: List of maintenance windows, as per sortOrder/sortBy/offset/limit; an empty list indicates no more to be retrieved
          items:
            $ref: '#/components/schemas/MaintenanceWindowDto'
        count:
          type: integer
          description: Total number of maintenace windows that would have been returned in the absence of offset and limit
          format: int64
    MoogFailureResponse:
      type: object
      description: Config API failure response body
      properties:
        status:
          type: string
          description: Failure status indicator (always "failure")
          examples:
          - failure
        message:
          type: string
        additional:
          type: array
          items:
            type: string
      required:
      - status
      - message
    MaintenanceStatusDto:
      type: object
      title: Maintenance Status Dto
      description: Definition for a given maintenance window's status
      properties:
        id:
          type: string
          description: Unique id of the maintenance window
          readOnly: true
        name:
          type: string
          description: Name of the maintenance window
          readOnly: true
        status:
          $ref: '#/components/schemas/MaintenanceStatus'
          description: Overall status, based on window occurrences
        expired_occurrence:
          $ref: '#/components/schemas/MaintenanceOccurrenceDto'
          description: Previous occurrence that ran or was cancelled
        running_occurrence:
          $ref: '#/components/schemas/MaintenanceOccurrenceDto'
          description: Currently running occurrence, if any
        pending_occurrence:
          $ref: '#/components/schemas/MaintenanceOccurrenceDto'
          description: Next pending occurrence, if any
    MaintenanceOccurrenceDto:
      type: object
      title: Maintenance Occurrence Dto
      description: Definition for a specific occurrence of a maintenance window
      properties:
        name:
          type: string
          description: Name of the maintenance window
          pattern: ^[a-zA-Z0-9()_\-\s]+$
        description:
          type: string
          description: Description of the maintenance window
        external_link:
          type: string
          description: Optional change Record link to an external system
        filter:
          type: string
          description: Required filter string
        start:
          $ref: '#/components/schemas/Timestamp'
          description: Start time of the maintenance window, milliseconds since Jan 1, 1970 GMT
        duration:
          type: integer
          description: Duration of the maintenance window, in seconds
          format: int32
          minimum: 60
        timezone:
          type: string
          description: Optional timezone of the maintenance window; used for display purposes
        repeats:
          $ref: '#/components/schemas/Repeatable'
          description: 'Optional repeating operation (note: only one of ''until'' and ''times'' is allowed to be used)'
          discriminator:
            propertyName: period
            mapping:
              daily: '#/components/schemas/DailyRepeatable'
              weekly: '#/components/schemas/WeeklyRepeatable'
              monthly: '#/components/schemas/MonthlyRepeatable'
              monthly_nth_day: '#/components/schemas/MonthlyDaysRepeatable'
        status:
          $ref: '#/components/schemas/MaintenanceStatus'
          description: Status of the maintenance window, based upon occurrences
        created:
          $ref: '#/components/schemas/Timestamp'
          description: When the maintenance window was created
        last_updated:
          $ref: '#/components/schemas/Timestamp'
          description: When the maintenance window was last updated
        created_by:
          type: string
          description: User who created the maintenance window
          readOnly: true
        last_updated_by:
          type: string
          description: User who last updated the maintenance window
          readOnly: true
        id:
          type: string
          description: Unique id of the maintenance window occurrence
          readOnly: true
        window_id:
          type: string
          description: Unique id of the maintenance window associated with this occurrence
          readOnly: true
        actual_start:
          $ref: '#/components/schemas/Timestamp'
          description: Actual start time of the occurrence, milliseconds since Jan 1, 1970 GMT
        actual_duration:
          type: integer
          description: Actual duration of the occurrence, in seconds
          format: int32
          readOnly: true
      required:
      - filter
      - start
      - duration
    MoogResponseMaintenanceOccurrenceDto:
      type: object
      description: Config API MaintenanceOccurrenceDto response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
          - success
        data:
          $ref: '#/components/schemas/MaintenanceOccurrenceDto'
      required:
      - status
      - data
    MaintenanceOccurrenceListDto:
      type: object
      title: Maintenance Occurrence List Dto
      properties:
        result:
          type: array
          description: List of maintenance window occurrences, as per sortOrder/sortBy/offset/limit; an empty list indicates no more to be retrieved
          items:
            $ref: '#/components/schemas/MaintenanceOccurrenceDto'
        count:
          type: integer
          description: Total number of occurrences that would have been returned in the absence of offset and limit and unique
          format: int64
    Timestamp:
      type: integer
      title: Timestamp
      description: Number of milliseconds since Jan 1, 1970 UTC
      format: int64
    MoogResponseListOfTimezoneDto:
      type: object
      description: Config API TimezoneDto response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
