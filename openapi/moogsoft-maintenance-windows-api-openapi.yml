          type: integer
          description: Specifies limit when retrieving the maintenance windows
          format: int32
          exclusiveMinimum: 0
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          description: Specifies offset record when retrieving the maintenance windows
          format: int32
          minimum: 0
          default: 0
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - created
          - lastUpdated
          - name
          - createdBy
          - lastUpdatedBy
          - start
          description: Specifies the column to sort by when retrieving the maintenance windows
          default: created
      - name: sortOrder
        in: query
        schema:
          type: string
          enum:
