      operationId: listAlerts
      parameters:
        - name: User-Agent
          in: header
          schema:
            type: string
        - name: filter
          in: query
          description: Return only alerts that match this filter.<br>Returns **400 (Invalid parameters)** if the filter format is invalid.
          schema:
            type: string
            examples:
              - '''event count'' > 3 AND severity in (Critical, Major, Minor, Warning)'
          examples:
            default:
              value: '''event count'' > 3 AND severity in (Critical, Major, Minor, Warning)'
        - name: jsonFilter
          in: query
          description: 'Return only alerts that match this AG-Grid-style JSON filter, such as {"status":{"values":["open","in progress","resolved"],"filterType":"set"}}'
          deprecated: true
          schema:
            type: string
        - name: jsonSort
          in: query
          description: 'Sort the results according to this AG-Grid-style JSON sort info, such as [{"sort":"asc","colId":"severity"}]'
          deprecated: true
          schema:
            type: string
        - name: keyword
          in: query
          description: Return only alerts that contain these keywords.
          schema:
            type: string
            examples:
              - compute
          examples:
            default:
              value: compute
        - name: limit
          in: query
          description: Maximum number of alerts to return. This is equivalent to the maximum number of alerts per page. Between 1 and 5
          schema:
            type: integer
            format: int32
            exclusiveMinimum: 0
            maximum: 5000
            default: 100
            examples:
              - 100
          examples:
            default:
              value: 100
        - name: start
          in: query
          description: 'The starting offset of alerts to retrieve. The initial offset to use is 0 and thereafter is typically multiples of ''limit''. <b>NOTE:</b> ''start'' + ''limit'' must not exceed 10,000 -- use ''searchAfter'' with the listAlertsPost operation instead.'
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
            examples:
              - 0
          examples:
            default:
              value: 0
        - name: utcOffset
          in: query
          description: UTC Offset
          schema:
            type: string
            default: GMT-0
            examples:
              - GMT-0
          examples:
            default:
              value: GMT-0
