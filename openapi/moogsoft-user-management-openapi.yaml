  /v1/sso/connection:
    patch:
      tags:
        - SSO
      summary: Edit SSO connection
      description: Edit SSO connection
      operationId: editSSOConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 60
                options:
                  $ref: '#/components/schemas/SSOConnOptionsDto'
                domains:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: \S
                useMapping:
                  type: boolean
                useGroupMapping:
                  type: boolean
                defaultRoleId:
                  type: string
                mapping:
                  type: object
                  additionalProperties:
                    type: string
                groupMapping:
                  type: object
                  additionalProperties:
                    type: string
                isMultiTenant:
                  type: boolean
              required:
                - name
                - options
                - domains
            examples:
              SSO Connection:
                description: Parameters use to create a valid OIDC sso connection
                value:
                  name: connectionName
                  options:
                    clientId: yourClientID
                    clientSecret: yourClientSecret
                    discoveryUrl: your-discovery-url.com
                    claimsScope: ''
                    claimsFieldName: roles
                    groupClaimsFieldName: ''
                    strategy: oidc
                  domains:
                    - your-domain.com
                  mapping:
                    yourSSORole: yourMoogsoftRoleId
                  useMapping: true
                  groupMapping: {}
                  useGroupMapping: false
      responses:
