  schemas:
    MoogResponseListOfGroupDto:
      type: object
      description: User API GroupDto response body
      properties:
        status:
          type: string
          description: Success status indicator (always "success")
          examples:
            - success
        data:
          type: array
          items:
            $ref: '#/components/schemas/GroupDto'
      required:
        - status
        - data
    GroupDto:
      type: object
      title: Group Dto
      properties:
        name:
          type: string
          description: The name of your user group
          pattern: '^[a-zA-Z0-9.&()_\-\s]+$'
          minLength: 1
          maxLength: 127
          examples:
            - Support Team
        description:
          type: string
          description: Description of your user group
          examples:
            - Group for Support Team
        groupMembers:
          type: array
          description: List of the unique IDs for the members of the group
          examples:
            - - 6217d0958391447445648af4
              - 6217d095839144744565dg7
          items:
            type: string
        roleAssignment:
          type: string
          description: Unique ID of the role to be assigned to the group
          examples:
            - 6217d0958391498735648za2
        id:
          type: string
          description: ID of the user group
          examples:
            - 6217d0958391447445648ab2
        created:
          $ref: '#/components/schemas/Instant'
        createdBy:
          type: string
        lastModified:
          $ref: '#/components/schemas/Instant'
        lastModifiedBy:
          type: string
        isSso:
          type: boolean
      required:
        - name
        - id
    Instant:
      type: number
      title: Instant
      format: int64
      examples:
        - '2022-03-10T16:15:50Z'
    MoogFailureResponse:
      type: object
      description: User API failure response body
      properties:
        status:
          type: string
          description: Failure status indicator (always "failure")
          examples:
            - failure
        message:
          type: string
        additional:
          type: array
          items:
            type: string
      required:
        - status
        - message
    MoogErrorResponse:
