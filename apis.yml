aid: moogsoft
name: Moogsoft
description: 'Moogsoft is an AIOps platform for IT operations, DevOps and SRE teams that ingests events,
  alerts and metrics from across a hybrid estate, deduplicates and reduces noise, correlates related alerts
  into incidents, detects anomalies in metric streams, and surfaces probable root cause and similar past
  incidents so responders can act faster. Founded in 2011 by Phil Tee and Mike Silvey, Moogsoft was acquired
  by Dell Technologies in October 2023 and the SaaS product is now sold as Dell APEX AIOps Incident Management,
  while the moogsoft.com brand, documentation and API surface remain live. The platform is API-first:
  seventeen public OpenAPI 3.1 contracts covering alerts and incidents, configuration, catalogs, correlation
  definitions, maintenance windows, collectors, inbound event/metric integrations, bring-your-own integrations,
  on-call scheduling, outbound webhooks, workflow automation, user and API-key management are published
  from api.moogsoft.ai and documented on a public Stoplight portal at api.docs.moogsoft.com.'
type: Index
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Commercial SaaS with a callable API host (api.moogsoft.ai); an on-prem line also exists as Moogsoft
    Enterprise v8.x
  confidence: high
  source:
  - openapi/ servers[] = https://api.moogsoft.ai on 16 of 17 contracts
  - https://www.moogsoft.com/legal-information/moogsoft-cloud-terms-of-service/
  - https://docs.moogsoft.com/ (separate Enterprise 8.0/8.1 and AIOps 7.2/7.3 documentation sets)
  generated: '2026-08-29'
  method: searched
accessModel:
  pricing: contact-sales
  onboarding: sales-led
  trial: false
  try_now: false
  public: false
  label: Contact sales — no public pricing, no free tier, no self-service sign-up
  confidence: high
  source:
  - plans/moogsoft-plans-pricing.yml
  - https://www.moogsoft.com/pricing/ (HTTP 404)
  - https://app.moogsoft.ai/ (302 to Auth0 sign-in, no registration)
  generated: '2026-08-29'
  method: searched
  note: Corrects a prior derived value of "freemium" that came from a 2026-05-04 plans scaffold inventing
    a Free tier Moogsoft has never published.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/moogsoft.png
tags:
- AIOps
- Incident Management
- Observability
- Alerting
- Event Management
- Anomaly Detection
- Correlation
- On-Call
- Monitoring
- IT Operations
- DevOps
- SRE
