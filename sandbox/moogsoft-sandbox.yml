provider_operated_sandbox: false
note: Moogsoft operates no customer sandbox, no test mode, no test keys and no free tier — the product
  is contact-sales only and app.moogsoft.ai is sign-in only. What DOES exist, and is callable right now
  with no credentials, is a Prism mock server that Stoplight generates from Moogsoft's own published API
  project. Every one of the 17 service nodes exposes a mock_url. It is hosted by Stoplight, not Moogsoft,
  and it returns the example values declared in the provider contracts — useful for building and testing
  a client against the real schemas before buying, and honestly labelled here as spec-derived rather than
  provider-operated.
