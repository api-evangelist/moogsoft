description: Moogsoft publishes no public pricing. https://www.moogsoft.com/pricing/ returns HTTP 404
  and no pricing, plans, free-tier, trial or self-serve sign-up link appears anywhere in the site navigation.
  The only commercial route on the site is a contact form and a partner sales address (HCL-Moogsoft-Sales@hcltech.com);
  app.moogsoft.ai is a sign-IN only console behind Auth0, with no sign-up path. Since the Dell acquisition
  the product is sold as Dell APEX AIOps Incident Management through Dell and its partners. This file
  replaces a 2026-05-04 API Evangelist scaffold that invented Free / Professional / Enterprise tiers with
  request quotas Moogsoft has never published.
